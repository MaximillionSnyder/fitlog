<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>AppSalud — Mis ejercicios</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div>
    <h1>AppSalud</h1>
    <p id="today" class="muted"></p>
  </div>
  <div id="headerStat" class="header-stat"></div>
</header>

<main>

  <section id="view-register" class="view active">
    <div class="card">
      <label class="field-label">Ejercicio</label>
      <div id="exerciseChips" class="chips"></div>
      <input id="customExercise" class="input" placeholder="Escribe otro ejercicio y pulsa Enter" hidden>
    </div>

    <div class="card">
      <div class="segmented" id="typeToggle">
        <button type="button" data-type="reps" class="active">Reps y peso</button>
        <button type="button" data-type="time">Tiempo</button>
      </div>

      <div id="repsFields">
        <div id="setRows"></div>
        <button type="button" id="addSet" class="btn ghost full">+ Añadir serie</button>
      </div>

      <div id="timeFields" hidden>
        <div class="timer">
          <span id="timerDisplay" class="timer-display">00:00</span>
          <button type="button" id="timerToggle" class="btn primary">Iniciar</button>
          <button type="button" id="timerReset" class="btn ghost">Reset</button>
        </div>
        <label class="field-label" for="durationInput">Duración (minutos)</label>
        <input id="durationInput" class="input" type="number" inputmode="decimal" min="0" step="0.5" placeholder="Ej: 1.5">
      </div>
    </div>

    <div class="card">
      <label class="field-label" for="entryDate">Fecha</label>
      <input id="entryDate" class="input" type="date">
      <label class="field-label" for="entryNotes">Notas (opcional)</label>
      <input id="entryNotes" class="input" placeholder="¿Cómo te sentiste?">
    </div>

    <button type="button" id="saveEntry" class="btn primary big full">Guardar entrenamiento</button>
  </section>

  <section id="view-history" class="view">
    <div class="row-actions">
      <button type="button" id="exportData" class="btn ghost">Exportar</button>
      <button type="button" id="importData" class="btn ghost">Importar</button>
      <button type="button" id="clearData" class="btn danger">Borrar todo</button>
      <input type="file" id="importFile" accept="application/json,.json" hidden>
    </div>
    <div id="historyList"></div>
  </section>

  <section id="view-progress" class="view">
    <div class="card">
      <label class="field-label" for="progressExercise">Ejercicio</label>
      <select id="progressExercise" class="input"></select>
      <div id="progressStats" class="stats"></div>
    </div>
    <div class="card chart-card">
      <canvas id="progressChart"></canvas>
      <p id="chartEmpty" class="muted center" hidden>Sin datos todavía para este ejercicio.</p>
    </div>
    <div class="card">
      <h3>Resumen general</h3>
      <div id="globalStats" class="stats"></div>
    </div>
  </section>

</main>

<nav class="tabbar">
  <button type="button" data-view="register" class="active">Registrar</button>
  <button type="button" data-view="history">Historial</button>
  <button type="button" data-view="progress">Progreso</button>
</nav>

<div id="toast" class="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="app.js"></script>
</body>
</html>
