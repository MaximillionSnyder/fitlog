name: Release Android

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag de la release (ej. v0.1)'
        required: true
        default: 'v0.1'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: APK y Release
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar plataforma y build-tools del SDK
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(ls -1 "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | tail -1)"
          test -n "$SDKMANAGER" || { echo "sdkmanager no encontrado en $SDK_ROOT"; exit 1; }
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Verificar esquema canonico
        working-directory: .
        run: |
          node shared/schema/build-schema.mjs
          git diff --exit-code -- shared/schema/schema.sql

      - name: Tests unitarios
        run: gradle :app:testDebugUnitTest

      - name: Build APK release
        run: gradle :app:assembleRelease

      - name: Preparar APK
        id: apk
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/release/fitlog-$TAG.apk"
          echo "path=$RUNNER_TEMP/release/fitlog-$TAG.apk" >> "$GITHUB_OUTPUT"
          echo "asset=fitlog-$TAG.apk" >> "$GITHUB_OUTPUT"
          ls -la "$RUNNER_TEMP/release"

      - name: Publicar Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          NOTES="$(cat <<'EOF'
          APK de FitLog para instalar en Android 8 o superior.

          **Firma**: este APK usa la clave de depuracion (no es apto para Play Store).
          **Instalacion**: descargar el APK en el telefono y abrirlo; aceptar el aviso de
          "instalar apps de origen desconocido" si aparece.
          EOF
          )"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${{ steps.apk.outputs.path }}" --clobber
          else
            gh release create "$TAG" "${{ steps.apk.outputs.path }}" \
              --title "FitLog $TAG" \
              --notes "$NOTES" \
              --generate-notes
          fi
