name: Release Android

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag de la release (ej. v0.1.7)'
        required: true
        default: 'v0.1.7'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: APK y Release
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar plataforma y build-tools del SDK
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(ls -1 "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | tail -1)"
          test -n "$SDKMANAGER" || { echo "sdkmanager no encontrado en $SDK_ROOT"; exit 1; }
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-37" "build-tools;36.0.0"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'

      - name: Verificar esquema canonico
        working-directory: .
        run: |
          node shared/schema/build-schema.mjs
          git diff --exit-code -- shared/schema/schema.sql

      - name: Recrear keystore desde secretos
        id: fingerprint
        working-directory: .
        run: |
          mkdir -p android/keystore
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/keystore/fitlog.jks
          test -s android/keystore/fitlog.jks || { echo "El keystore esta vacio"; exit 1; }
          SHA256=$(keytool -list -v -keystore android/keystore/fitlog.jks \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" | grep -E "SHA256:" | head -1 | sed 's/.*SHA256: //')
          echo "Huella SHA-256: $SHA256"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"

      - name: Tests unitarios
        run: gradle :app:testDebugUnitTest

      - name: Build APK release
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          gradle :app:assembleRelease \
            -PversionName="${TAG#v}" \
            -PFITLOG_STORE_PASSWORD="${{ secrets.KEYSTORE_PASSWORD }}" \
            -PFITLOG_KEY_ALIAS="${{ secrets.KEY_ALIAS }}" \
            -PFITLOG_KEY_PASSWORD="${{ secrets.KEY_PASSWORD }}"

      - name: Subir reportes de tests si fallan
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports-release
          path: android/app/build/reports/tests/**
          if-no-files-found: ignore

      - name: Preparar APK
        id: apk
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/release/fitlog-$TAG.apk"
          echo "path=$RUNNER_TEMP/release/fitlog-$TAG.apk" >> "$GITHUB_OUTPUT"
          ls -la "$RUNNER_TEMP/release"

      - name: Publicar Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          FINGERPRINT: ${{ steps.fingerprint.outputs.sha256 }}
        run: |
          NOTES="$(cat <<'EOF'
          APK de FitLog para instalar en Android 8 o superior, firmado con el keystore propio del proyecto.

          **Firma**: clave fitlog (RSA 4096). Huella SHA-256: __FINGERPRINT__
          **Instalacion**: si venis de una version 0.1.x anterior (firmada con la clave de depuracion), desinstala la app antes de instalar esta.
          EOF
          )"
          NOTES="${NOTES/__FINGERPRINT__/$FINGERPRINT}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${{ steps.apk.outputs.path }}" --clobber
            gh release edit "$TAG" --notes "$NOTES"
          else
            gh release create "$TAG" "${{ steps.apk.outputs.path }}" \
              --title "FitLog $TAG" \
              --notes "$NOTES" \
              --generate-notes
          fi
