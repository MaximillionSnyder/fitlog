name: Android

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'shared/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'shared/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build y tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar plataforma y build-tools del SDK
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(ls -1 "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | tail -1)"
          test -n "$SDKMANAGER" || { echo "sdkmanager no encontrado en $SDK_ROOT"; exit 1; }
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-37" "build-tools;36.0.0"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'

      - name: Verificar esquema canonico
        working-directory: .
        run: |
          node shared/schema/build-schema.mjs
          git diff --exit-code -- shared/schema/schema.sql

      - name: Tests unitarios
        run: gradle :app:testDebugUnitTest

      - name: Build APK debug
        run: gradle :app:assembleDebug

      - name: Subir reportes de tests si fallan
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: android/app/build/reports/tests/**
          if-no-files-found: ignore

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: fitlog-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
