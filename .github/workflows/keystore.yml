name: Keystore one-off

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    name: Generar keystore de release
    runs-on: ubuntu-latest
    steps:
      - name: JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Generar keystore y credenciales
        run: |
          mkdir -p android/keystore
          STORE_PASSWORD="$(openssl rand -hex 16)"
          KEY_PASSWORD="$(openssl rand -hex 16)"
          keytool -genkeypair \
            -keystore android/keystore/fitlog.jks \
            -alias fitlog \
            -keyalg RSA \
            -keysize 4096 \
            -validity 10950 \
            -storepass "$STORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -dname "CN=FitLog, OU=Personal, O=FitLog, L=Lima, C=PE"
          base64 -w0 android/keystore/fitlog.jks > android/keystore/fitlog.jks.base64
          {
            echo "KEYSTORE_BASE64: usar el archivo fitlog.jks.base64"
            echo "KEYSTORE_PASSWORD=$STORE_PASSWORD"
            echo "KEY_ALIAS=fitlog"
            echo "KEY_PASSWORD=$KEY_PASSWORD"
          } > android/keystore/credentials.txt
          echo "Huella de la clave:"
          keytool -list -v -keystore android/keystore/fitlog.jks -storepass "$STORE_PASSWORD" \
            | grep -E "SHA256:|Alias name:" | head -3

      - name: Subir artifact del keystore
        uses: actions/upload-artifact@v4
        with:
          name: fitlog-keystore
          path: android/keystore/
          retention-days: 3
